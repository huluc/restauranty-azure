# Tell Argo CD that ghcr.io/nginx/charts is a Helm OCI registry (public, no credentials)
apiVersion: v1
kind: Secret
metadata:
  name: repo-nginx-charts
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  name: nginx-charts
  url: ghcr.io/nginx/charts
  type: helm
  enableOCI: "true"
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: nginx-gateway-fabric
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters: {}
  template:
    metadata:
      name: 'nginx-gateway-fabric-{{.name}}'
    spec:
      project: default
      source:
        repoURL: ghcr.io/nginx/charts
        chart: nginx-gateway-fabric
        targetRevision: 2.8.1
        helm:
          releaseName: ngf
      destination:
        server: '{{.server}}'
        namespace: nginx-gateway
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
