apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: gateway-api-crds
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters: {}
  template:
    metadata:
      name: 'gateway-api-crds-{{.name}}'
    spec:
      project: default
      source:
        repoURL: https://github.com/nginx/nginx-gateway-fabric.git
        targetRevision: v2.8.1
        path: config/crd/gateway-api/standard
      destination:
        server: '{{.server}}'
      syncPolicy:
        automated:
          prune: false
          selfHeal: true
        syncOptions:
          - ServerSideApply=true
