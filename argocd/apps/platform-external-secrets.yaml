apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: external-secrets
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters: {}
  template:
    metadata:
      name: 'external-secrets-{{.name}}'
    spec:
      project: default
      source:
        repoURL: https://charts.external-secrets.io
        chart: external-secrets
        targetRevision: 2.14.0
        helm:
          releaseName: external-secrets
          valuesObject:
            serviceAccount:
              name: external-secrets
              annotations:
                azure.workload.identity/client-id: f0038007-3bca-4b92-b9b7-92a4749a2a53
            podLabels:
              azure.workload.identity/use: "true"
      destination:
        server: '{{.server}}'
        namespace: external-secrets
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
