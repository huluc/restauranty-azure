apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: restauranty-base
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters: {}
  template:
    metadata:
      name: 'restauranty-base-{{.name}}'
    spec:
      project: default
      source:
        repoURL: https://github.com/huluc/restauranty-azure.git
        targetRevision: main
        path: k8s
      destination:
        server: '{{.server}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
