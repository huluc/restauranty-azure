apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mongodb-auth
  namespace: restauranty
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-key-vault
  target:
    name: mongodb-auth
  data:
    - secretKey: username
      remoteRef:
        key: mongodb-username
    - secretKey: password
      remoteRef:
        key: mongodb-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: restauranty-backend
  namespace: restauranty
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-key-vault
  target:
    name: restauranty-backend
    template:
      engineVersion: v2
      data:
        SECRET: "{{ .jwt }}"
        MONGODB_URI: "mongodb://{{ .mongoUser }}:{{ .mongoPass }}@mongodb:27017/resturanty?authSource=admin"
        CLOUD_NAME: "{{ .cloudName }}"
        CLOUD_API_KEY: "{{ .cloudKey }}"
        CLOUD_API_SECRET: "{{ .cloudSecret }}"
  data:
    - secretKey: jwt
      remoteRef: { key: jwt-secret }
    - secretKey: mongoUser
      remoteRef: { key: mongodb-username }
    - secretKey: mongoPass
      remoteRef: { key: mongodb-password }
    - secretKey: cloudName
      remoteRef: { key: cloudinary-cloud-name }
    - secretKey: cloudKey
      remoteRef: { key: cloudinary-api-key }
    - secretKey: cloudSecret
      remoteRef: { key: cloudinary-api-secret }
