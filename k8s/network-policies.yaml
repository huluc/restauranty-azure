# 1) Deny all incoming traffic to every pod in the namespace by default
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: restauranty
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
# 2) The gateway (NGINX) accepts traffic from the internet on port 80
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-internet-to-gateway
  namespace: restauranty
spec:
  podSelector:
    matchLabels:
      gateway.networking.k8s.io/gateway-name: restauranty
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: 80
---
# 3) The four services accept traffic only from the gateway, only on their http port
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-to-services
  namespace: restauranty
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [auth, discounts, items, client]
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              gateway.networking.k8s.io/gateway-name: restauranty
      ports:
        - port: http
---
# 4) MongoDB accepts traffic only from the three backends, only on 27017
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backends-to-mongodb
  namespace: restauranty
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mongodb
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [auth, discounts, items]
      ports:
        - port: 27017
