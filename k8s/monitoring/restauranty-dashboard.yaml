apiVersion: v1
kind: ConfigMap
metadata:
  name: restauranty-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  restauranty.json: |
    {
      "title": "Restauranty",
      "uid": "restauranty",
      "schemaVersion": 39,
      "time": { "from": "now-1h", "to": "now" },
      "refresh": "30s",
      "panels": [
        {
          "type": "timeseries",
          "title": "Ready pods per service",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "refId": "A", "expr": "sum by (deployment) (kube_deployment_status_replicas_ready{namespace=\"restauranty\"})", "legendFormat": "{{deployment}}" }
          ]
        },
        {
          "type": "timeseries",
          "title": "HPA desired replicas",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "refId": "A", "expr": "kube_horizontalpodautoscaler_status_desired_replicas{namespace=\"restauranty\"}", "legendFormat": "{{horizontalpodautoscaler}}" }
          ]
        },
        {
          "type": "timeseries",
          "title": "Memory per pod (from prom-client)",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "bytes" }, "overrides": [] },
          "targets": [
            { "refId": "A", "expr": "process_resident_memory_bytes{namespace=\"restauranty\"}", "legendFormat": "{{pod}}" }
          ]
        },
        {
          "type": "timeseries",
          "title": "CPU per pod (cores)",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "refId": "A", "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"restauranty\", container!=\"\"}[5m]))", "legendFormat": "{{pod}}" }
          ]
        }
      ]
    }
