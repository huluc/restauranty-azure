replicaCount: 2

image:
  repository: acrhilalrestauranty.azurecr.io/restauranty-client
  tag: "local"

port: 8080
probePath: /
runAsUser: 101

env: []

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: false
  minAvailable: 1
