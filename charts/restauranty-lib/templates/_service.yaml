{{- define "restauranty-lib.service" -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "restauranty-lib.name" . }}
  labels:
    {{- include "restauranty-lib.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "restauranty-lib.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.port }}
      targetPort: http
{{- end }}
